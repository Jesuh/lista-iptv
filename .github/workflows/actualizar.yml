name: Actualizador de Lista AceStream
on:
  schedule:
    # 13:50 en España (CEST) es 11:50 en hora UTC
    - cron: '50 11 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Descargar y Transformar con Python
        run: |
          python3 -c '
          import urllib.request

          ipns_key = "k2k4r8lm8tkmuxbc8lkmq1in3v0oya1p6pe9o5bu0hu30br5ko08k2gb"
          m3u_content = None

          # Pasarelas usando el formato de subdominio IPNS (evita el bloqueo de inbrowser.link)
          subdomain_urls = [
              f"https://{ipns_key}.ipns.cf-ipfs.com/data/listas/lista_iptv.m3u",
              f"https://{ipns_key}.ipns.dweb.link/data/listas/lista_iptv.m3u",
              f"https://{ipns_key}.ipns.w3s.link/data/listas/lista_iptv.m3u",
              f"https://gateway.pinata.cloud/ipns/{ipns_key}/data/listas/lista_iptv.m3u"
          ]

          for url in subdomain_urls:
              try:
                  print(f"Probando pasarela: {url}")
                  req = urllib.request.Request(
                      url, 
                      headers={"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}
                  )
                  with urllib.request.urlopen(req, timeout=15) as response:
                      content = response.read().decode("utf-8", errors="ignore")
                      # Validar que sea una lista m3u real y no un HTML de service worker
                      if "#EXT" in content and "<html" not in content.lower():
                          m3u_content = content
                          print(f"¡Éxito descargando desde {url}!")
                          break
                      else:
                          print("El contenido descargado no es un archivo M3U válido (es un HTML).")
              except Exception as e:
                  print(f"Falló la conexión con {url}: {e}")

          if not m3u_content:
              raise RuntimeError("Error crítico: Ninguna pasarela pudo descargar la lista M3U en crudo.")

          # Reemplazar la IP local por la IP de tu NAS (puerto 6878)
          m3u_modificado = m3u_content.replace("http://127.0.0.1:6878", "http://192.168.18.197:6878")

          with open("lista_nas.m3u", "w", encoding="utf-8") as f:
              f.write(m3u_modificado)
          print("Archivo lista_nas.m3u procesado y guardado correctamente.")
          '

      - name: Guardar cambios en GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add lista_nas.m3u
          git commit -m "Lista actualizada automáticamente $(date +'%d-%m-%Y')" || exit 0
          git push
