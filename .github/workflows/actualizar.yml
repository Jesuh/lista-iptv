name: Actualizador de Lista AceStream
on:
  schedule:
    # 13:50 en España (CEST) es 11:50 en hora UTC
    - cron: '50 11 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Instalar dependencias de Python
        run: |
          python3 -m pip install --upgrade pip
          pip install curl_cffi

      - name: Descargar lista en crudo con emulación de navegador y Transformar
        run: |
          python3 -c '
          from curl_cffi import requests
          import time

          ipns_key = "k2k4r8lm8tkmuxbc8lkmq1in3v0oya1p6pe9o5bu0hu30br5ko08k2gb"
          target_path = "/data/listas/lista_iptv.m3u"
          m3u_content = None

          # Pasarelas oficiales IPFS que entregan texto plano usando la huella de navegador
          gateways = [
              f"https://ipfs.io/ipns/{ipns_key}{target_path}",
              f"https://cloudflare-ipfs.com/ipns/{ipns_key}{target_path}",
              f"https://{ipns_key}.ipns.dweb.link{target_path}"
          ]

          for url in gateways:
              try:
                  print(f"Probando pasarela con emulación de navegador: {url}")
                  # Impersonamos Chrome 120 para sortear cualquier filtro anti-bot
                  response = requests.get(url, impersonate="chrome120", timeout=20)
                  print(f"Código HTTP recibido: {response.status_code}")
                  
                  if response.status_code == 200:
                      content = response.text
                      # Validar que sea un archivo M3U real y no una página web HTML
                      if "#EXT" in content and "<html" not in content.lower():
                          m3u_content = content
                          print("¡Éxito rotundo descargando la lista M3U en crudo!")
                          break
                      else:
                          print("La respuesta es una página web HTML, buscando en la siguiente pasarela...")
              except Exception as e:
                  print(f"Falló la conexión con {url}: {e}")
              time.sleep(1)

          if not m3u_content:
              raise RuntimeError("Error crítico: Ninguna pasarela pudo entregar la lista M3U válida.")

          # Reemplazar la IP local por la IP de tu NAS (puerto 6878)
          m3u_modificado = m3u_content.replace("http://127.0.0.1:6878", "http://192.168.18.197:6878")

          with open("lista_nas.m3u", "w", encoding="utf-8") as f:
              f.write(m3u_modificado)
          print("¡Archivo lista_nas.m3u procesado y guardado correctamente!")
          '

      - name: Guardar cambios en GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add lista_nas.m3u
          git commit -m "Lista actualizada automáticamente $(date +'%d-%m-%Y')" || exit 0
          git push
