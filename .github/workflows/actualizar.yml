name: Actualizador de Lista AceStream
on:
  schedule:
    # 13:50 en España (CEST) es 11:50 en hora UTC
    - cron: '50 11 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Instalar dependencias de Python
        run: |
          python3 -m pip install --upgrade pip
          pip install curl_cffi

      - name: Descargar con emulación de navegador y Transformar
        run: |
          python3 -c '
          from curl_cffi import requests
          import time

          url = "https://k2k4r8lm8tkmuxbc8lkmq1in3v0oya1p6pe9o5bu0hu30br5ko08k2gb.ipns.inbrowser.link/data/listas/lista_iptv.m3u"
          m3u_content = None

          print(f"Conectando a la lista mediante emulación de navegador...")
          for intento in range(3):
              try:
                  # Impersonamos Chrome 120 para saltarnos barreras de pasarelas y Cloudflare
                  response = requests.get(url, impersonate="chrome120", timeout=20)
                  if response.status_code == 200:
                      content = response.text
                      if "#EXT" in content:
                          m3u_content = content
                          print("¡Descarga exitosa con huella de navegador!")
                          break
                  print(f"Intento {intento+1}: Código HTTP {response.status_code}")
              except Exception as e:
                  print(f"Error en intento {intento+1}: {e}")
              time.sleep(2)

          if not m3u_content:
              raise RuntimeError("Error crítico: No se pudo descargar la lista M3U.")

          # Reemplazar la IP local por la IP de tu NAS (puerto 6878)
          m3u_modificado = m3u_content.replace("http://127.0.0.1:6878", "http://192.168.18.197:6878")

          with open("lista_nas.m3u", "w", encoding="utf-8") as f:
              f.write(m3u_modificado)
          print("¡Archivo lista_nas.m3u procesado y guardado correctamente!")
          '

      - name: Guardar cambios en GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add lista_nas.m3u
          git commit -m "Lista actualizada automáticamente $(date +'%d-%m-%Y')" || exit 0
          git push
