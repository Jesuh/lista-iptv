name: Actualizador de Lista AceStream
on:
  schedule:
    # 13:50 en España (CEST) es 11:50 en hora UTC
    - cron: '50 11 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v3

      - name: Descargar, Transformar y Limpiar
        run: |
          # Pasarelas IPFS en formato de subdominio y alternativas
          GATEWAYS=(
            "https://k2k4r8lm8tkmuxbc8lkmq1in3v0oya1p6pe9o5bu0hu30br5ko08k2gb.ipns.dweb.link/data/listas/lista_iptv.m3u"
            "https://k2k4r8lm8tkmuxbc8lkmq1in3v0oya1p6pe9o5bu0hu30br5ko08k2gb.ipns.w3s.link/data/listas/lista_iptv.m3u"
            "https://gateway.pinata.cloud/ipns/k2k4r8lm8tkmuxbc8lkmq1in3v0oya1p6pe9o5bu0hu30br5ko08k2gb/data/listas/lista_iptv.m3u"
          )

          # Probar cada gateway hasta encontrar una lista válida
          SUCCESS=0
          for url in "${GATEWAYS[@]}"; do
            echo "Probando gateway: $url"
            curl -sL -A "Mozilla/5.0" "$url" > temporal.m3u
            if grep -q "#EXT" temporal.m3u; then
              echo "¡Descarga correcta desde $url!"
              SUCCESS=1
              break
            fi
          done

          if [ $SUCCESS -eq 0 ]; then
            echo "Error: Ningún gateway devolvió una lista válida."
            exit 1
          fi

          # Reemplazar la IP local por la IP de tu NAS
          sed 's|http://127.0.0.1:6878|http://192.168.18.197:6878|g' temporal.m3u > lista_nas.m3u

      - name: Guardar cambios en GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add lista_nas.m3u
          git commit -m "Lista actualizada automáticamente $(date +'%d-%m-%Y')" || exit 0
          git push
