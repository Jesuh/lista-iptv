name: Actualizador de Lista AceStream
on:
  schedule:
    # 13:50 en España (CEST) es 11:50 en hora UTC
    - cron: '50 11 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      # Usamos la acción oficial del Marketplace para instalar Kubo sin sufrir bloqueos de IP
      - name: Instalar Kubo (IPFS Nativo)
        uses: ipfs/setup-ipfs@v1
        with:
          ipfs_version: ^0.27.0

      - name: Descargar por P2P Nativo y Transformar
        run: |
          python3 -c '
          import subprocess
          import time

          ipns_key = "k2k4r8lm8tkmuxbc8lkmq1in3v0oya1p6pe9o5bu0hu30br5ko08k2gb"
          target_file = f"/ipns/{ipns_key}/data/listas/lista_iptv.m3u"
          m3u_content = None

          print("Iniciando daemon de IPFS...")
          daemon = subprocess.Popen(["ipfs", "daemon", "--offline"], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          time.sleep(3)

          try:
              print(f"Obteniendo archivo P2P: {target_file}")
              # Timeout estricto de 30s al comando cat de ipfs
              res = subprocess.run(["ipfs", "cat", target_file], capture_output=True, text=True, timeout=30)
              if "#EXT" in res.stdout:
                  m3u_content = res.stdout
                  print("¡Lista M3U recuperada con éxito vía IPFS P2P!")
          except Exception as e:
              print(f"Aviso en consulta P2P: {e}")
          finally:
              daemon.terminate()

          if not m3u_content:
              raise RuntimeError("Error crítico: No se pudo recuperar la lista M3U a través de IPFS.")

          # Reemplazar la IP local por la IP de tu NAS (puerto 6878)
          m3u_modificado = m3u_content.replace("http://127.0.0.1:6878", "http://192.168.18.197:6878")

          with open("lista_nas.m3u", "w", encoding="utf-8") as f:
              f.write(m3u_modificado)
          print("¡Archivo lista_nas.m3u guardado con éxito!")
          '

      - name: Guardar cambios en GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add lista_nas.m3u
          git commit -m "Lista actualizada automáticamente $(date +'%d-%m-%Y')" || exit 0
          git push
