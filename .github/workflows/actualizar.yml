name: Actualizador de Lista AceStream
on:
  schedule:
    # 13:50 en España (CEST) es 11:50 en hora UTC
    - cron: '50 11 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Instalar cliente IPFS (Kubo)
        run: |
          # Descargar e instalar la herramienta oficial de IPFS
          wget -q https://dist.ipfs.tech/kubo/v0.27.0/kubo_v0.27.0_linux-amd64.tar.gz
          tar -xzf kubo_v0.27.0_linux-amd64.tar.gz
          sudo bash kubo/install.sh
          ipfs init --offline

      - name: Descargar por red P2P y Transformar
        run: |
          IPNS_KEY="k2k4r8lm8tkmuxbc8lkmq1in3v0oya1p6pe9o5bu0hu30br5ko08k2gb"
          
          echo "Iniciando nodo IPFS local en segundo plano..."
          ipfs daemon --offline &
          sleep 3

          echo "Descargando lista directamente desde la red IPFS..."
          # Obtener el archivo mediante P2P sin usar gateways web HTTP
          ipfs cat "/ipns/$IPNS_KEY/data/listas/lista_iptv.m3u" > temporal.m3u || true

          # Detener el daemon
          pkill ipfs || true

          # Validar que el archivo descargado sea una lista M3U real
          if ! grep -q "#EXT" temporal.m3u; then
            echo "Error: No se pudo recuperar la lista a través de la red IPFS."
            exit 1
          fi

          # Reemplazar la IP local por la IP de tu NAS
          sed 's|http://127.0.0.1:6878|http://192.168.18.197:6878|g' temporal.m3u > lista_nas.m3u
          echo "¡Lista transformada y guardada con éxito!"

      - name: Guardar cambios en GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add lista_nas.m3u
          git commit -m "Lista actualizada automáticamente $(date +'%d-%m-%Y')" || exit 0
          git push
